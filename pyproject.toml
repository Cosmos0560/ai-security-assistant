[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-security-assistant"
dynamic = ["version"]
description = "CLI assistant that triages synthetic SOC alerts with an LLM, with a defense layer against indirect prompt injection."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Otabek Yakubov" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "hypothesis",
]

[project.scripts]
aisa = "ai_security_assistant.cli:main"

[tool.hatch.version]
path = "src/ai_security_assistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_security_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff only excludes .venv by default; the two check venvs live in the project folder too.
extend-exclude = [".venv-wsl", ".venv-release"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: calls a real external API; deselected by default and never run in CI",
]

[tool.coverage.run]
source = ["ai_security_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
